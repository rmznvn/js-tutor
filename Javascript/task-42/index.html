<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cinema seat finder</title>
  </head>
  <body>
    <main>
      <h1>Find adjacent cinema seats</h1>
      <p>Available seats are green. Choose a group size from 1 to 4.</p>

      <label>
        Group size
        <input id="group-size" type="number" min="1" max="4" value="2" />
      </label>
      <button id="find-button" type="button">Find seats</button>

      <div id="seat-row" aria-label="Cinema row"></div>
      <p id="result" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
